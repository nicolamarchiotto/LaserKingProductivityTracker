<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Il Misuratore Ufficiale della Sopravvivenza Settimanale™ %</title>

  <style>
    /* --- Windows 95-ish vibe --- */
    :root{
      --win-bg: #c0c0c0;
      --win-face: #c0c0c0;
      --win-dark: #808080;
      --win-darker:#404040;
      --win-light:#ffffff;
      --win-blue:#000080;
      --text:#000;
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--win-bg);
      color: var(--text);
      font-family: "MS Sans Serif", Tahoma, Verdana, Arial, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap { max-width: 760px; margin: 18px auto; padding: 0 12px; }

    /* Window frame */
    .window {
      border: 2px solid var(--win-dark);
      border-top-color: var(--win-light);
      border-left-color: var(--win-light);
      background: var(--win-face);
      box-shadow: 1px 1px 0 #000;
    }

    .titlebar {
      background: var(--win-blue);
      color: #fff;
      padding: 6px 8px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      font-weight: 700;
      letter-spacing: 0.2px;
      user-select: none;
    }

    .titlebar .controls {
      display:flex; gap:6px;
    }

    .tb-btn{
      width: 16px; height: 14px;
      background: var(--win-face);
      border: 2px solid var(--win-dark);
      border-top-color: var(--win-light);
      border-left-color: var(--win-light);
      box-shadow: 1px 1px 0 #000;
    }

    .content { padding: 12px; }

    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
    .spacer { flex: 1 1 auto; }

    .label { font-size: 12px; margin-bottom: 4px; }

    input {
      padding: 6px 8px;
      border: 2px solid var(--win-dark);
      border-top-color: var(--win-darker);
      border-left-color: var(--win-darker);
      background: #fff;
      border-radius: 0;
      outline: none;
      min-width: 110px;
    }

    /* Windows 95 button effect */
    button {
      padding: 7px 10px;
      background: var(--win-face);
      border: 2px solid var(--win-dark);
      border-top-color: var(--win-light);
      border-left-color: var(--win-light);
      box-shadow: 1px 1px 0 #000;
      cursor: pointer;
      border-radius: 0;
      font-family: inherit;
    }
    button:active{
      border-top-color: var(--win-dark);
      border-left-color: var(--win-dark);
      border-bottom-color: var(--win-light);
      border-right-color: var(--win-light);
      box-shadow: none;
      transform: translate(1px,1px);
    }

    .pill{
      padding: 4px 8px;
      background: #fff;
      border: 2px solid var(--win-dark);
      border-top-color: var(--win-darker);
      border-left-color: var(--win-darker);
      display:inline-block;
      box-shadow: inset 1px 1px 0 #00000010;
    }

    hr {
      border: none;
      height: 2px;
      background: var(--win-dark);
      box-shadow: 0 1px 0 var(--win-light);
      margin: 12px 0;
    }

    h1 { margin: 0 0 10px; font-size: 18px; }
    h3 { margin: 10px 0 6px; font-size: 14px; }

    .muted { color: #222; opacity: .8; }

    /* Progress bars (chunky) */
    .bar {
      height: 18px;
      background: #fff;
      border: 2px solid var(--win-dark);
      border-top-color: var(--win-darker);
      border-left-color: var(--win-darker);
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 0%;
      background: #0a7a0a; /* classic green */
      transition: width .4s ease;
    }
    .fill.week { background: #0a7a0a; }
    .fill.day  { background: #7a0a0a; } /* reddish, retro alert vibe */

    /* Weekend-near background */
    body.weekend-soon { background: #fff8dc; }

    /* Boss mode */
    body.boss .meme,
    body.boss .goliardico,
    body.boss .hide-in-boss {
      display: none !important;
    }
    body.boss .titlebar {
      background: #0b3d91;
    }
    body.boss .titlebar .titletext::after{
      content: "  •  KPI Dashboard";
      font-weight: 400;
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="window">
      <div class="titlebar">
        <div class="titletext">WorkWeek Meter 95</div>
        <div class="controls" aria-hidden="true">
          <div class="tb-btn"></div>
          <div class="tb-btn"></div>
          <div class="tb-btn"></div>
        </div>
      </div>

      <div class="content">
        <div class="row" style="margin-bottom:8px;">
          <h1 class="hide-in-boss">📊 Il Misuratore Ufficiale della Sopravvivenza Settimanale™</h1>
          <div class="spacer"></div>
          <span class="pill" id="now">Ora: --:--</span>
        </div>

        <div class="row">
          <div>
            <div class="label">Inizio lavoro</div>
            <input id="start" type="time" value="09:00">
          </div>
          <div>
            <div class="label">Fine lavoro</div>
            <input id="end" type="time" value="18:00">
          </div>
          <div>
            <div class="label">Pausa (min)</div>
            <input id="break" type="number" value="60" min="0" step="5">
          </div>

          <div style="display:flex; gap:8px;">
            <button id="save">Salva</button>
            <button id="boss">Boss Mode</button>
          </div>
        </div>

        <hr>

        <h3>Settimana</h3>
        <div class="bar"><div class="fill week" id="weekFill"></div></div>
        <div class="row" style="justify-content:space-between; margin-top:8px;">
          <span class="pill" id="weekPct">0%</span>
          <span class="muted" id="toWeekend">…</span>
        </div>

        <h3>Giornata</h3>
        <div class="bar"><div class="fill day" id="dayFill"></div></div>
        <div class="row" style="justify-content:space-between; margin-top:8px;">
          <span class="pill" id="dayPct">0%</span>
          <span class="muted" id="dayMsg">…</span>
        </div>

        <hr class="hide-in-boss">

        <div class="meme goliardico" style="font-weight:700; font-size:16px;" id="meme">🙂</div>
        <div class="muted" id="status"></div>
      </div>
    </div>
  </div>

<script>
  // --- helpers ---
  const pad = n => String(n).padStart(2,'0');

  const msToHM = (ms) => {
    ms = Math.max(0, ms);
    const m = Math.floor(ms / 60000);
    const h = Math.floor(m / 60);
    const mm = m % 60;
    return `${h}h ${mm}m`;
  };

  function parseTimeToMinutes(t) {
    const [h,m] = t.split(':').map(Number);
    return h*60 + m;
  }

  function loadSettings() {
    const s = JSON.parse(localStorage.getItem('workweekSettings') || '{}');
    if (s.start) document.getElementById('start').value = s.start;
    if (s.end) document.getElementById('end').value = s.end;
    if (s.breakMin != null) document.getElementById('break').value = s.breakMin;
    if (s.bossMode) document.body.classList.toggle('boss', !!s.bossMode);
  }

  function saveSettings() {
    const start = document.getElementById('start').value;
    const end = document.getElementById('end').value;
    const breakMin = Number(document.getElementById('break').value || 0);
    const bossMode = document.body.classList.contains('boss');
    localStorage.setItem('workweekSettings', JSON.stringify({ start, end, breakMin, bossMode }));
  }

  function memeFor(p) {
    if (p >= 100) return "🏖️ WEEKEND MODE: LEGGENDA";
    if (p >= 90) return "🎉 QUASI! Non mollare adesso";
    if (p >= 75) return "😤 Resistenza attiva";
    if (p >= 50) return "🙂 Metà strada. Ancora respiri.";
    if (p >= 25) return "🥲 È lunga, ma ce la fai";
    return "🫠 Inizio settimana: perché.";
  }

  function workMinutesElapsedToday(nowMin, startMin, endMin, breakMin) {
    if (nowMin <= startMin) return 0;
    const shiftLen = endMin - startMin;
    if (shiftLen <= 0) return 0;

    // Break assumed centered in the shift (simple + robust)
    const breakStart = startMin + Math.floor(shiftLen/2) - Math.floor(breakMin/2);
    const breakEnd = breakStart + breakMin;

    if (nowMin >= endMin) return Math.max(0, shiftLen - breakMin);

    const elapsedSinceStart = nowMin - startMin;

    let breakElapsed = 0;
    if (nowMin <= breakStart) breakElapsed = 0;
    else if (nowMin >= breakEnd) breakElapsed = breakMin;
    else breakElapsed = nowMin - breakStart;

    return Math.max(0, elapsedSinceStart - breakElapsed);
  }

  function tick() {
    const now = new Date();
    const day = now.getDay(); // 0=Sun ... 6=Sat
    const hh = pad(now.getHours()), mm = pad(now.getMinutes());
    document.getElementById('now').textContent = `Ora: ${hh}:${mm}`;

    // Settings
    const startMin = parseTimeToMinutes(document.getElementById('start').value);
    const endMin   = parseTimeToMinutes(document.getElementById('end').value);
    const breakMin = Number(document.getElementById('break').value || 0);

    const workDayMin = Math.max(0, (endMin - startMin) - breakMin);
    const workWeekMin = workDayMin * 5;

    const isWeekend = (day === 0 || day === 6);
    const nowMin = now.getHours()*60 + now.getMinutes();

    // --- Week progress: Mon-Fri only ---
    let completedWeekMin = 0;

    for (let d = 1; d <= 5; d++) { // Mon..Fri
      if (day > d) {
        completedWeekMin += workDayMin;
      } else if (day === d) {
        const within = Math.min(workDayMin, workMinutesElapsedToday(nowMin, startMin, endMin, breakMin));
        completedWeekMin += within;
      }
    }

    const weekPct = (workWeekMin === 0) ? 0 : (isWeekend ? 100 : (completedWeekMin / workWeekMin) * 100);
    const weekPctClamped = Math.max(0, Math.min(100, weekPct));

    // --- (1) Dynamic tab title ---
    document.title = `${weekPctClamped.toFixed(1)}% settimana - Resistiamo`;

    // --- (2) “Weekend soon” background when basically done ---
    document.body.classList.toggle('weekend-soon', weekPctClamped >= 99 && weekPctClamped < 100);

    document.getElementById('weekFill').style.width = `${weekPctClamped.toFixed(1)}%`;
    document.getElementById('weekPct').textContent = `${weekPctClamped.toFixed(1)}%`;

    // Time to weekend (Friday end)
    let toWeekendMs = 0;
    if (!isWeekend) {
      const fri = new Date(now);
      const deltaToFri = 5 - day; // Fri=5
      fri.setDate(fri.getDate() + deltaToFri);

      const [endH, endM] = document.getElementById('end').value.split(':').map(Number);
      fri.setHours(endH, endM, 0, 0);

      toWeekendMs = fri - now;
    }
    document.getElementById('toWeekend').textContent = isWeekend
      ? "Weekend già in corso 😎"
      : `Al weekend: ${msToHM(toWeekendMs)}`;

    // --- Day progress ---
    let dayCompleted = 0;
    let dayState = "";

    if (isWeekend || day < 1 || day > 5) {
      dayCompleted = workDayMin;
      dayState = "Oggi è weekend (o non lavorativo).";
    } else if (nowMin <= startMin) {
      dayCompleted = 0;
      dayState = "Ancora non hai iniziato (o fai finta).";
    } else if (nowMin >= endMin) {
      dayCompleted = workDayMin;
      dayState = "Giornata finita. Se qualcuno ti cerca: eri in riunione.";
    } else {
      dayCompleted = Math.min(workDayMin, workMinutesElapsedToday(nowMin, startMin, endMin, breakMin));

      // Basic pause detection (same centered-break model)
      const shiftLen = endMin - startMin;
      const breakStart = startMin + Math.floor(shiftLen/2) - Math.floor(breakMin/2);
      const breakEnd = breakStart + breakMin;

      if (breakMin > 0 && nowMin >= breakStart && nowMin < breakEnd) dayState = "Pausa. Non farti vedere online.";
      else dayState = "Operativo. O quantomeno presente.";
    }

    const dayPct = (workDayMin === 0) ? 0 : (dayCompleted / workDayMin) * 100;
    const dayPctClamped = Math.max(0, Math.min(100, dayPct));

    document.getElementById('dayFill').style.width = `${dayPctClamped.toFixed(1)}%`;
    document.getElementById('dayPct').textContent = `${dayPctClamped.toFixed(1)}%`;
    document.getElementById('dayMsg').textContent = dayState;

    // Meme/status
    document.getElementById('meme').textContent = memeFor(weekPctClamped);
    document.getElementById('status').textContent =
      `Minuti settimana completati: ${Math.round(completedWeekMin)} / ${Math.round(workWeekMin)}.`;
  }

  // init
  loadSettings();

  document.getElementById('save').addEventListener('click', () => {
    saveSettings();
    tick();
  });

  // --- (3) Boss mode toggle ---
  document.getElementById('boss').addEventListener('click', () => {
    document.body.classList.toggle('boss');
    saveSettings();
    tick();
  });

  tick();
  setInterval(tick, 10000);
</script>
</body>
</html>
