<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Pages Demo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 15px;
      font-size: 2rem;
    }

    p {
      margin-bottom: 20px;
      line-height: 1.5;
    }

    button {
      background: white;
      color: #4f46e5;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      background: #f3f4f6;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>GitHub Pages App</h1>

    <p>
      Simple HTML, CSS, and JavaScript application ready for deployment on GitHub Pages.
    </p>

    <button onclick="showMessage()">
      Click Me
    </button>

    <div id="message"></div>
  </div>

  <script>
    function showMessage() {
      const message = document.getElementById("message");

      const messages = [
        "Hello from GitHub Pages 🚀",
        "Your app is working 🎉",
        "Static sites are awesome ✨",
        "JavaScript is running successfully ⚡"
      ];

      const random =
        messages[Math.floor(Math.random() * messages.length)];

      message.textContent = random;
    }
  </script>

</body>
</html>
